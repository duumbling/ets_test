name: Verify map builder dependencies on Windows

on:
  push:
    paths:
      - 'tools/build_real_map.py'
      - 'tools/test_windows_commands.py'
      - 'tools/patch_upstream_sii.py'
      - 'tools/test_sii_patch.py'
      - 'tools/patch_upstream_icons.py'
      - 'tools/test_icon_patch.py'
      - 'tools/fixtures/sii-comment-test.ts'
      - '.github/workflows/map-cli-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-cli:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout navigator tools
        uses: actions/checkout@v4
      - name: Install Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify Python unit tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify navigator command generation
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Clone map parser with submodules
        shell: pwsh
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/truckermudgeon/maps.git maps-upstream
      - name: Install CLI-only dependencies (no postinstall symlinks)
        shell: pwsh
        working-directory: maps-upstream
        run: |
          npm install --ignore-scripts --no-audit --no-fund --workspace packages/clis/parser --workspace packages/clis/generator --workspace packages/libs/base --workspace packages/libs/io --workspace packages/libs/map
      - name: Compile native map parser
        shell: pwsh
        working-directory: maps-upstream
        run: npm run build --workspace packages/clis/parser
      - name: Apply local SII lexer compatibility patch
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tools'); from patch_upstream_sii import patch_parser; from pathlib import Path; print(patch_parser(Path('maps-upstream')))"
      - name: Skip optional TOBJ icon decoding in route-only mode
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tools'); from patch_upstream_icons import patch_icon_decoding; from pathlib import Path; print(patch_icon_decoding(Path('maps-upstream')))"
      - name: Assert route-only parser is loaded without decoding TOBJ textures
        shell: pwsh
        working-directory: maps-upstream
        run: |
          npx --no-install tsx -e "import {parseMapFiles} from './packages/clis/parser/game-files/map-files-parser.ts'; if (typeof parseMapFiles !== 'function') throw Error('parser not available'); console.log('Route-only parser import OK');"
      - name: Test multiline SII comments with actual game parser
        shell: pwsh
        run: |
          Copy-Item tools/fixtures/sii-comment-test.ts maps-upstream/sii-comment-test.ts
          Push-Location maps-upstream
          try { npx --no-install tsx sii-comment-test.ts; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { Pop-Location }
      - name: Check CLI commands without ETS2 installation
        shell: pwsh
        working-directory: maps-upstream
        run: |
          npx --no-install tsx packages/clis/parser/index.ts --help
          npx --no-install tsx packages/clis/generator/index.ts --help
