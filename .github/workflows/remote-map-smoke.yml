name: Verify external ETS2 map accessibility

on:
  push:
    paths:
      - 'tools/check_remote_map.py'
      - '.github/workflows/remote-map-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout ETS2 Navigator
        uses: actions/checkout@v4
      - name: Verify range requests and cross-origin browser availability
        run: python3 tools/check_remote_map.py
