name: Deploy ETS2 Navigator to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JS syntax and route algorithm
        run: |
          node --check site/app.js
          node --check site/routepack.js
          node --check site/pois.js
          node --check site/road-cache.js
          node --check site/map-storage.js
          node tools/test_routepack.js
          node tools/test_pois.js
          node tools/test_road_cache.js
          node tools/test_map_storage.js
      - name: Verify map conversion
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: ets2-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Allow GitHub artifact index to settle
        run: sleep 12
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ets2-pages-${{ github.run_id }}-${{ github.run_attempt }}
